# Brand codes used on the Material Sales report.
# Left side: the code exactly as the report writes it (any capitalization).
# Right side: the brand name as the ClaimForm spells it.
# The full brand names (General, Hercules, ...) are also recognized automatically.
# To teach the app a new code, add a line here. It takes effect the next time a report is read.
# If a Pirelli (or any other) line shows "brand: unknown", add its code to the right section.

[claimform]
CON = "Continental"
FAL = "Falken"
GEN = "General"
HER = "Hercules"
NIT = "Nitto"
NOK = "Nokian"
PIRELLI = "Pirelli"   # Pirelli's short code on the report is not known yet, add it here when seen
TOY = "Toyo"

# Brands that show up on the report but are NOT on the ClaimForm, so they are never eligible.
# Listing them lets the app tell that a line like "IRON iMOVE GEN 3" is an Ironman tire and
# not a General tire.
[other]
CAR = "Carlisle"
FST = "FST"
IRON = "Ironman"
