# How Auto Spiffer talks to the ATD ProRewards claim page.
# If the website changes and something stops working, the fix is usually one line here
# (a selector below), not a new version of the app.

[site]
live_url = "https://prorewards.acbrewards.com/"
# "auto" tries Google Chrome first, then Microsoft Edge. Or write "chrome" or "msedge".
browser = "chrome"

# Seconds to wait for each kind of step before giving up on it.
[timeouts]
action = 10
add = 25
upload = 90

# Where things are on the "Submit a Sales Claim" page (CSS selectors).
[selectors]
date = "#ctl00_DefaultContent_InvoiceDateRadDatePicker_dateInput"
date_client_state = "#ctl00_DefaultContent_InvoiceDateRadDatePicker_ClientState"
invoice = "#ctl00_DefaultContent_InvoiceNumberTextBox"
product_select = "#DefaultContent_ProductDropdownList"
product_chosen = "#DefaultContent_ProductDropdownList_chosen"
qty = "#ctl00_DefaultContent_QtyClaimedRadNumericTextBox"
add = "#DefaultContent_AddProductLinkButton"
grid = "#ctl00_DefaultContent_ProductRadGrid_ctl00"
upload_input = "#ctl00_DefaultContent_FileUploadRadAsyncUploadfile0"
uploaded_panel = "#DefaultContent_UploadedFilesPanel"
duplicate_popup = "#DefaultContent_DuplicateLineItemMessagePopupPanel"
duplicate_no = "#DefaultContent_DuplicateLineItemMessagePopupPanel button"
validation_popup = "#DefaultContent_ValidationPopupPanel"
next_button = "#DefaultContent_GoToStepFourLinkButton"

# The app refuses to click these, ever. Nothing is submitted by Auto Spiffer.
[never_click]
selectors = [
  "#DefaultContent_GoToStepFourLinkButton",
  "#DefaultContent_BackToStepTwoLinkButton",
  "#DefaultContent_YesLinkButton",
  "#DefaultContent_SubmitDuplicatesLinkButton",
  "#DefaultContent_PostClaimDuplicatesLinkButton",
]

# How the app notices that an invoice PDF finished uploading (any of these showing up counts).
[upload]
done_selectors = [
  "#DefaultContent_UploadedFilesPanel table tbody tr",
  ".ruUploadSuccess",
]
